[package]
name = "llm-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "llm-proxy"

[lib]
name = "llm_proxy"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
proxy-service = { path = "../crates/proxy-service" }
proxy-core = { path = "../crates/proxy-core" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile = "3"
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation", "block2"] }

[dev-dependencies]
tempfile = "3"
