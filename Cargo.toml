[workspace]
members = ["crates/proxy-core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.100"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
thiserror = "2"
url = "2"
zeroize = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
