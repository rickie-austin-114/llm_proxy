[package]
name = "proxy-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "llm-proxy-worker"
path = "src/main.rs"

[dependencies]
proxy-core = { path = "../proxy-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
rustls.workspace = true
rcgen.workspace = true
keyring-core = "1"
tempfile = "3"
rustls-native-certs = "0.8"
sha2 = "0.10"
time = "0.3"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Pipes"] }
